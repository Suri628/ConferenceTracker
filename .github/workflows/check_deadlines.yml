name: Update conference deadlines

on:
  schedule:
    # 多伦多时间周一凌晨 2 点。GitHub Actions cron 只认 UTC，这里按夏令时(EDT, UTC-4)算的 UTC 06:00；
    # 冬令时(EST, UTC-5)期间实际会在多伦多时间的凌晨 3 点跑，一年中大约 4 个月有 1 小时漂移，不影响周任务
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync base conference info (from ccfddl/ccf-deadlines)
        run: python scripts/sync_base_info.py

      - name: Check workshop proposal deadlines
        # Brave Search 兜底暂时关掉：2027 届 workshop 信息现在(2026年年中)基本都还没公布，
        # 搜出来的假阳性比真结果多（过期页面/不相关页面/regex 瞎抠出的日期）。
        # 等临近会议、workshop 信息陆续公布了再把下面这行取消注释重新打开
        # env:
        #   BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_APIKEY }}
        run: python scripts/check_workshop_deadlines.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/Conferences.xlsx
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: weekly deadline update"
          git push
