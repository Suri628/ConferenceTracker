name: Update conference deadlines

on:
  schedule:
    # 多伦多时间周一凌晨 2 点。GitHub Actions cron 只认 UTC，这里按夏令时(EDT, UTC-4)算的 UTC 06:00；
    # 冬令时(EST, UTC-5)期间实际会在多伦多时间的凌晨 3 点跑，一年中大约 4 个月有 1 小时漂移，不影响周任务
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync base conference info (from ccfddl/ccf-deadlines)
        run: python scripts/sync_base_info.py

      - name: Check workshop proposal deadlines
        # Brave Search 兜底目前在代码里硬关闭了（scripts/check_workshop_deadlines.py 里的
        # ENABLE_BRAVE_SEARCH = False），配不配这个 secret 都不会生效。等以后要重新打开，
        # 把那个常量改回 True，再取消下面注释配置 key
        # env:
        #   BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_APIKEY }}
        run: python scripts/check_workshop_deadlines.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/Conferences.xlsx
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: weekly deadline update"
          git push
