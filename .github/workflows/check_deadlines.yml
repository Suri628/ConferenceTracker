name: Update conference deadlines

on:
  schedule:
    # 每周一 00:00 UTC 跑一次
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync base conference info (from ccfddl/ccf-deadlines)
        run: python scripts/sync_base_info.py

      - name: Check workshop proposal deadlines
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: python scripts/check_workshop_deadlines.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/conferences.xlsx
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: weekly deadline update"
          git push
